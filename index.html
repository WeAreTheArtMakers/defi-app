<style>
  :root { color-scheme: light dark; --bg:#0b1220; --card:#121b2e; --ink:#e7ecf5; --muted:#8a96ad; --accent:#e9b949; --line:#22304b; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7fb; --card:#fff; --ink:#10172a; --muted:#566079; --line:#dfe3ec; } }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:18vh 20px 40px; }
  h1 { font-size:26px; margin:0 0 8px; letter-spacing:-.01em; }
  p { color:var(--muted); margin:0 0 20px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  a.btn { display:inline-block; padding:11px 18px; border-radius:10px; font-weight:600; text-decoration:none; border:1px solid var(--line); color:var(--ink); background:var(--card); }
  a.btn.primary { background:var(--accent); color:#10172a; border-color:var(--accent); }
  a.btn:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  footer { margin-top:48px; font-size:13px; color:var(--muted); }
  footer a { color:var(--muted); }
</style>
